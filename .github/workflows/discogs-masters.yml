name: Refresh Discogs masters

on:
  schedule:
    - cron: "23 8 5 * *"
  workflow_dispatch:
    inputs:
      snapshot:
        description: Discogs snapshot date (YYYYMMDD). Leave blank to discover the latest.
        type: string

permissions:
  contents: write

concurrency:
  group: discogs-masters
  cancel-in-progress: false

jobs:
  import:
    runs-on: ${{ vars.DISCOGS_MASTERS_SELF_HOSTED == 'true' && fromJSON('["self-hosted", "discogs-data"]') || 'ubuntu-latest' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Find latest Discogs snapshot
        id: snapshot
        env:
          REQUESTED_SNAPSHOT: ${{ inputs.snapshot }}
        run: |
          set -euo pipefail
          snapshot="$REQUESTED_SNAPSHOT"
          if [[ -z "$snapshot" ]]; then
            year=$(date -u +%Y)
            if listing=$(curl -fsSL --retry 3 "https://data.discogs.com/?prefix=data/${year}/"); then
              snapshot=$(printf '%s\n' "$listing" |
                sed -nE 's@.*href="\?download=data%2F[0-9]{4}%2Fdiscogs_([0-9]{8})_masters\.xml\.gz".*@\1@p' |
                sort | tail -1)
            fi
            if [[ -z "$snapshot" ]]; then
              snapshot=$(date -u +%Y%m01)
              echo "Discogs listing unavailable. Trying the dated $snapshot download."
            fi
          fi
          [[ "$snapshot" =~ ^[0-9]{8}$ ]] || { echo "Expected a snapshot date in YYYYMMDD format." >&2; exit 1; }
          echo "date=$snapshot" >> "$GITHUB_OUTPUT"

      - name: Check whether this snapshot is already published
        id: published
        env:
          GH_TOKEN: ${{ github.token }}
          SNAPSHOT: ${{ steps.snapshot.outputs.date }}
        run: |
          set -euo pipefail
          if gh release view "discogs-masters-$SNAPSHOT" --json isDraft,assets \
            --jq 'select(.isDraft == false and (.assets | length) == 2) | true' |
            grep -qx true; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify and index the dump
        if: steps.published.outputs.current != 'true'
        env:
          SNAPSHOT: ${{ steps.snapshot.outputs.date }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/discogs-masters"
          mkdir -p "$work"
          base="https://data.discogs.com/?download=data%2F${SNAPSHOT:0:4}%2Fdiscogs_${SNAPSHOT}"
          file="discogs_${SNAPSHOT}_masters.xml.gz"
          if ! curl -fsSL --retry 3 "${base}_CHECKSUM.txt" -o "$work/checksums"; then
            echo "::error::Discogs would not serve the checksum for $SNAPSHOT to this runner."
            exit 1
          fi
          curl -fsSL --retry 3 "${base}_masters.xml.gz" -o "$work/$file"
          cd "$work"
          awk -v name="$file" '$2 == name {print; found++} END {if (found != 1) exit 1}' checksums |
            sha256sum --check
          cd "$GITHUB_WORKSPACE"
          npm ci
          time npm run import:discogs-masters -- "$SNAPSHOT" "$work/$file" "$work/discogs-masters.sqlite"
          du -h "$work/discogs-masters.sqlite"

      - name: Publish the catalog as a GitHub release asset
        if: steps.published.outputs.current != 'true' && github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ github.token }}
          SNAPSHOT: ${{ steps.snapshot.outputs.date }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/discogs-masters"
          gzip -n discogs-masters.sqlite
          sha256sum discogs-masters.sqlite.gz > discogs-masters.sqlite.gz.sha256
          tag="discogs-masters-$SNAPSHOT"
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "Discogs masters $SNAPSHOT" --notes "Catalog index derived from https://data.discogs.com/." \
              --draft --latest=false
          fi
          gh release upload "$tag" --repo "$GITHUB_REPOSITORY" --clobber \
            discogs-masters.sqlite.gz discogs-masters.sqlite.gz.sha256
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false --latest=false
