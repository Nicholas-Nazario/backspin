# Set app and APP_URL for your own Fly app before deployment.
app = "mystery-dj-change-me"
primary_region = "ewr"
[env]
  PORT = "3000"
  DATABASE_PATH = "/data/mystery.sqlite"
  APP_URL = "https://mystery-dj-change-me.fly.dev"
[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "15s"
    method = "GET"
    path = "/api/health"
[mounts]
  source = "mystery_data"
  destination = "/data"
[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
