# fly.toml app configuration file generated for backspin on 2026-11-21T15:59:37Z
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'backspin'
primary_region = 'ewr'

[build.args]
  DISCOGS_MASTERS_SNAPSHOT = "20261101"

[env]
  APP_URL = 'https://backspin.fly.dev'
  DATABASE_PATH = '/data/mystery.sqlite'
  PORT = '3000'

[[mounts]]
  source = 'mystery_data'
  destination = '/data'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '15s'
    method = 'GET'
    path = '/api/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
